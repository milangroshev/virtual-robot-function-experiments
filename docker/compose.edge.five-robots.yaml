        use_sim_time:=True
        robot_model:=panther
        observation_topic:=/panther2/velodyne_points
        observation_topic_type:=pointcloud

  # ===========================================================================
  # ROBOT 3 CONTROLLER (namespace = panther3)
  # ===========================================================================
  controller_3:
    <<: *nav2-common
    container_name: panther3_controller
    cpuset: "0-3,8-9"
    command: >
      ros2 launch husarion_ugv_navigation controller_launch.py
        namespace:=panther3
        params_file:=/config/nav2_params_panther3.yaml
        use_sim_time:=True
        robot_model:=panther
        observation_topic:=/panther3/velodyne_points
        observation_topic_type:=pointcloud

  # ===========================================================================
  # ROBOT 4 CONTROLLER (namespace = panther4)
  # ===========================================================================
  controller_4:
    <<: *nav2-common
    container_name: panther4_controller
    cpuset: "0-3,8-9"
