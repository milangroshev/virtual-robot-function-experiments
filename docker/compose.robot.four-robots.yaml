# =============================================================================
# HOST 1 (10.205.10.16) — Robot Simulation + Nav2 (minus controllers)
# =============================================================================
# Runs: gazebo, gz_robot_2, gz_robot_3, gz_robot_4, sensor_preproc (×4),
#       localization (×4), planner (×4), bt_orchestrator (×4)
# Does NOT run: controller, controller_2, controller_3, controller_4
#               (those are on HOST 2)
# =============================================================================

x-common-config:
  &common-config
  env_file: .env

x-nav2-common:
  &nav2-common
  <<: *common-config
  image: nav2-profiling:latest
  build:
    context: ..
    dockerfile: docker/Dockerfile
  environment:
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
    - CYCLONEDDS_URI=file:///config/cyclonedds-robot.xml
  volumes:
    - ./config:/config
    - ../maps:/maps
    - ../husarion_ugv_navigation:/ros2_ws/src/husarion_ugv_autonomy_ros/husarion_ugv_navigation
  network_mode: "host"
  ipc: host

volumes:
  shared_tmp:

services:
  # ===========================================================================
  # 0. GAZEBO — World + Robot 1 (panther)
  # ===========================================================================
  gazebo:
    image: husarion/husarion-ugv-gazebo:jazzy-add-parameter-to-disable-orientation
    container_name: gazebo
    <<: *common-config
    runtime: nvidia
    environment:
      - DISPLAY
      - CYCLONEDDS_URI=file:///config/cyclonedds-robot.xml
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./config:/config
      - shared_tmp:/tmp
    network_mode: "host"
    ipc: host
    healthcheck:
      test: >
        bash -c "/ros_entrypoint.sh ros2 topic echo --timeout 0.2
        --field header.frame_id /${ROBOT_NAMESPACE:-panther}/odometry/filtered
        | grep -q odom"
      interval: 4s
      timeout: 3s
      retries: 4
    command: >
      ros2 launch husarion_ugv_gazebo simulation.launch.py
        components_config_path:=/config/components.yaml
        namespace:=${ROBOT_NAMESPACE:-panther}
        robot_model:=${ROBOT_MODEL:-panther}
        gz_headless_mode:=True
        use_rviz:=False

  # ===========================================================================
  # 0b. ROBOT 2 SPAWNER
  # ===========================================================================
  gz_robot_2:
    image: husarion/husarion-ugv-gazebo:jazzy-add-parameter-to-disable-orientation
    container_name: gz_robot_2
    <<: *common-config
    runtime: nvidia
    environment:
      - DISPLAY
      - CYCLONEDDS_URI=file:///config/cyclonedds-robot.xml
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./config:/config
      - shared_tmp:/tmp
    network_mode: "host"
    ipc: host
    depends_on:
      gazebo:
        condition: service_healthy
        restart: true
    healthcheck:
      test: >
        bash -c "/ros_entrypoint.sh ros2 topic echo --timeout 0.2
        --field header.frame_id /panther2/odometry/filtered
        | grep -q odom"
      interval: 4s
      timeout: 3s
      retries: 6
      start_period: 20s
    command: >
      ros2 launch husarion_ugv_gazebo simulate_robot.launch.py
        namespace:=panther2
        robot_model:=${ROBOT_MODEL:-panther}
        components_config_path:=/config/components.yaml
        add_world_transform:=True
        x:=11.5
        y:=-9.3
        z:=0.2
        yaw:=1.39

  # ===========================================================================
  # 0c. ROBOT 3 SPAWNER
  # ===========================================================================
  gz_robot_3:
    image: husarion/husarion-ugv-gazebo:jazzy-add-parameter-to-disable-orientation
    container_name: gz_robot_3
