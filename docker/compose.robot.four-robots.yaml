      - ./scripts:/experiment/scripts
    network_mode: "host"
    ipc: host
    depends_on:
      bt_orchestrator:
        condition: service_healthy
        restart: true
      bt_orchestrator_2:
        condition: service_healthy
        restart: true
      bt_orchestrator_3:
        condition: service_healthy
        restart: true
      bt_orchestrator_4:
        condition: service_healthy
        restart: true
    command: >
      bash -c "source /ros_entrypoint.sh && python3 /experiment/scripts/four_robot_patrol.py 0 5"
