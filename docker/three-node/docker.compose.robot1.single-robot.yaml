# =============================================================================
# HOST 1 (10.205.10.16) — Robot Simulation Only
# =============================================================================
# Runs ONLY: gazebo (world + robot spawner for panther)
# Nav2 stack runs on HOST 2 (10.205.10.5) and the controller runs on HOST 3.
# =============================================================================

x-common-config:
  &common-config
  env_file: ../.env
  environment:
    - GZ_IP=127.0.0.1
    - IGN_IP=127.0.0.1

x-nav2-common:
  &nav2-common
  <<: *common-config
  image: nav2-profiling:latest
  build:
    context: ../..
    dockerfile: docker/Dockerfile
  environment:
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
    - CYCLONEDDS_URI=file:///config/cyclonedds-robot.xml
  volumes:
    - ../config:/config
    - ./config/cyclonedds-robot.xml:/config/cyclonedds-robot.xml
    - ../../maps:/maps
    - ../../husarion_ugv_navigation:/ros2_ws/src/husarion_ugv_autonomy_ros/husarion_ugv_navigation
  network_mode: "host"
  ipc: host

volumes:
  shared_tmp:

services:
  # ===========================================================================
  # 0. GAZEBO — World + Robot 1 (panther)
  # ===========================================================================
  gazebo:
    image: husarion/husarion-ugv-gazebo:jazzy-add-parameter-to-disable-orientation
    container_name: gazebo
    <<: *common-config
    runtime: nvidia
    environment:
      - DISPLAY
      - CYCLONEDDS_URI=file:///config/cyclonedds-robot.xml
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../config:/config
      - ./config/cyclonedds-robot.xml:/config/cyclonedds-robot.xml
      - shared_tmp:/tmp
      - ../gazebo_overrides/worlds/husarion_world.sdf:/ros2_ws/src/husarion_gz_worlds/worlds/husarion_world.sdf:ro
      - ../gazebo_overrides/worlds/husarion_world.sdf:/ros2_ws/install/husarion_gz_worlds/share/husarion_gz_worlds/worlds/husarion_world.sdf:ro
      - ../gazebo_overrides/urdf/velodyne_puck.urdf.xacro:/ros2_ws/src/husarion_components_description/urdf/velodyne_puck.urdf.xacro:ro
      - ../gazebo_overrides/urdf/velodyne_puck.urdf.xacro:/ros2_ws/install/husarion_components_description/share/husarion_components_description/urdf/velodyne_puck.urdf.xacro:ro
    network_mode: "host"
    ipc: host
    healthcheck:
      test: >
        bash -c "/ros_entrypoint.sh ros2 topic echo --timeout 0.2
        --field header.frame_id /${ROBOT_NAMESPACE:-panther}/odometry/filtered
        | grep -q odom"
      interval: 4s
      timeout: 3s
      retries: 4
    command: >
      ros2 launch husarion_ugv_gazebo simulation.launch.py
        components_config_path:=/config/components.yaml
        namespace:=${ROBOT_NAMESPACE:-panther}
        robot_model:=${ROBOT_MODEL:-panther}
        gz_headless_mode:=True
        use_rviz:=False
  sensor_preproc:
    <<: *nav2-common
    container_name: ${ROBOT_NAMESPACE:-panther}_sensor_preproc
    depends_on:
      gazebo:
        condition: service_healthy
    healthcheck:
      test: >
        bash -c "/ros_entrypoint.sh ros2 topic echo --timeout 0.5
        --field header.frame_id /${ROBOT_NAMESPACE:-panther}/velodyne_points_filtered
        | grep -q velodyne"
      interval: 4s
      timeout: 3s
      retries: 6
      start_period: 20s
    command: >
      ros2 launch husarion_ugv_navigation sensor_preproc_launch.py
        namespace:=${ROBOT_NAMESPACE:-panther}
        observation_topic:=/${ROBOT_NAMESPACE:-panther}/velodyne_points
        observation_topic_type:=pointcloud
        use_sim_time:=True
        robot_model:=${ROBOT_MODEL:-panther}
