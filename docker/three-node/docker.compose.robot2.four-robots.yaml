# =============================================================================
# HOST 2 (10.205.10.5) — Nav2 Stack Only (Four Robots)
# =============================================================================
# Runs the full Nav2 stack for all four robots:
#   sensor_preproc, localization, planner, bt_orchestrator (×4)
# Plus the experiment_panther patrol script.
#
# Gazebo runs on HOST 1 (10.205.10.16) and controllers run on HOST 3.
# Cross-host dependencies are removed because Docker Compose cannot track
# service health across different hosts. DDS discovery is handled by
# CycloneDDS with explicit peers configured in cyclonedds-nav.xml.
# =============================================================================

x-common-config:
  &common-config
  env_file: ../.env

x-nav2-common:
  &nav2-common
  <<: *common-config
  image: nav2-profiling:latest
  build:
    context: ../..
    dockerfile: docker/Dockerfile
  environment:
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
    - CYCLONEDDS_URI=file:///config/cyclonedds-nav.xml
  volumes:
    - ../config:/config
    - ./config/cyclonedds-nav.xml:/config/cyclonedds-nav.xml
    - ../../maps:/maps
    - ../../husarion_ugv_navigation:/ros2_ws/src/husarion_ugv_autonomy_ros/husarion_ugv_navigation
  network_mode: "host"
  ipc: host

services:
  # ===========================================================================
  # ROBOT 1 NAV2 STACK (namespace = panther) — NO GAZEBO, NO CONTROLLER
  # ===========================================================================

  localization:
    <<: *nav2-common
    container_name: ${ROBOT_NAMESPACE:-panther}_localization
    depends_on:
      sensor_preproc:
        condition: service_healthy
        restart: true
    healthcheck:
      test: >
        bash -c "/ros_entrypoint.sh ros2 topic echo --timeout 0.5
        --field id /${ROBOT_NAMESPACE:-panther}/bond
        | grep -q amcl"
      interval: 4s
      timeout: 3s
      retries: 6
      start_period: 20s
    command: >
      ros2 launch husarion_ugv_navigation localization_standalone_launch.py
        namespace:=${ROBOT_NAMESPACE:-panther}
        slam:=False
        map:=/maps/my_map.yaml
        params_file:=/config/nav2_params_panther1.yaml
        use_sim_time:=True
        robot_model:=${ROBOT_MODEL:-panther}
        observation_topic:=/${ROBOT_NAMESPACE:-panther}/velodyne_points
        observation_topic_type:=pointcloud

  planner:
    <<: *nav2-common
    container_name: ${ROBOT_NAMESPACE:-panther}_planner
    depends_on:
      localization:
        condition: service_healthy
        restart: true
    healthcheck:
      test: >
        bash -c "/ros_entrypoint.sh ros2 topic echo --timeout 0.5
        --field id /${ROBOT_NAMESPACE:-panther}/bond
        | grep -q planner_server"
      interval: 4s
      timeout: 3s
      retries: 6
      start_period: 20s
    command: >
      ros2 launch husarion_ugv_navigation planner_launch.py
        namespace:=${ROBOT_NAMESPACE:-panther}
        params_file:=/config/nav2_params_panther1.yaml
        use_sim_time:=True
        robot_model:=${ROBOT_MODEL:-panther}
        observation_topic:=/${ROBOT_NAMESPACE:-panther}/velodyne_points
        observation_topic_type:=pointcloud

  bt_orchestrator:
