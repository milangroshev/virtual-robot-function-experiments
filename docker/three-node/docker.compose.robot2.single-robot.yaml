# =============================================================================
# HOST 2 (10.205.10.5) — Nav2 Stack Only
# =============================================================================
# Runs the full Nav2 stack for a single robot (namespace = panther):
#   sensor_preproc, localization, planner, bt_orchestrator
# Plus the experiment_panther patrol script.
#
# Gazebo runs on HOST 1 (10.205.10.16) and the controller runs on HOST 3.
# Cross-host dependencies are removed because Docker Compose cannot track
# service health across different hosts. DDS discovery is handled by
# CycloneDDS with explicit peers configured in cyclonedds-nav.xml.
# =============================================================================

x-common-config:
  &common-config
  env_file: ../.env

x-nav2-common:
  &nav2-common
  <<: *common-config
  image: nav2-profiling:latest
  build:
    context: ../..
    dockerfile: docker/Dockerfile
  environment:
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
    - CYCLONEDDS_URI=file:///config/cyclonedds-nav.xml
  volumes:
    - ../config:/config
    - ./config/cyclonedds-nav.xml:/config/cyclonedds-nav.xml
    - ../../maps:/maps
    - ../../husarion_ugv_navigation:/ros2_ws/src/husarion_ugv_autonomy_ros/husarion_ugv_navigation
  network_mode: "host"
  ipc: host

services:
  # ===========================================================================
  # ROBOT 1 NAV2 STACK (namespace = panther) — NO GAZEBO, NO CONTROLLER
  # ===========================================================================

  localization:
    <<: *nav2-common
    container_name: ${ROBOT_NAMESPACE:-panther}_localization
    healthcheck:
      test: >
        bash -c "/ros_entrypoint.sh ros2 topic echo --timeout 0.5
        --field id /${ROBOT_NAMESPACE:-panther}/bond
        | grep -q amcl"
      interval: 4s
      timeout: 3s
      retries: 6
      start_period: 20s
    command: >
      ros2 launch husarion_ugv_navigation localization_standalone_launch.py
        namespace:=${ROBOT_NAMESPACE:-panther}
        slam:=False
        map:=/maps/my_map.yaml
        params_file:=/config/nav2_params_panther1.yaml
        use_sim_time:=True
        robot_model:=${ROBOT_MODEL:-panther}
        observation_topic:=/${ROBOT_NAMESPACE:-panther}/velodyne_points
        observation_topic_type:=pointcloud

  planner:
    <<: *nav2-common
    container_name: ${ROBOT_NAMESPACE:-panther}_planner
    depends_on:
      localization:
        condition: service_healthy
        restart: true
    healthcheck:
      test: >
        bash -c "/ros_entrypoint.sh ros2 topic echo --timeout 0.5
        --field id /${ROBOT_NAMESPACE:-panther}/bond
        | grep -q planner_server"
      interval: 4s
      timeout: 3s
      retries: 6
      start_period: 20s
    command: >
      ros2 launch husarion_ugv_navigation planner_launch.py
        namespace:=${ROBOT_NAMESPACE:-panther}
        params_file:=/config/nav2_params_panther1.yaml
        use_sim_time:=True
        robot_model:=${ROBOT_MODEL:-panther}
        observation_topic:=/${ROBOT_NAMESPACE:-panther}/velodyne_points
        observation_topic_type:=pointcloud

  # NOTE: bt_orchestrator depends ONLY on planner (not controller)
  # because controller runs on HOST 3. The bt_orchestrator will
  # discover the controller via DDS across the network.
  bt_orchestrator:
    <<: *nav2-common
    container_name: ${ROBOT_NAMESPACE:-panther}_bt_orchestrator
    depends_on:
      planner:
        condition: service_healthy
        restart: true
    healthcheck:
      test: >
        bash -c "/ros_entrypoint.sh ros2 topic echo --timeout 0.5
        --field id /${ROBOT_NAMESPACE:-panther}/bond
        | grep -q bt_navigator"
      interval: 4s
      timeout: 3s
      retries: 6
      start_period: 20s
    command: >
      ros2 launch husarion_ugv_navigation bt_orchestrator_launch.py
        namespace:=${ROBOT_NAMESPACE:-panther}
        params_file:=/config/nav2_params_panther1.yaml
        use_sim_time:=True
        robot_model:=${ROBOT_MODEL:-panther}
        observation_topic:=/${ROBOT_NAMESPACE:-panther}/velodyne_points
        observation_topic_type:=pointcloud

  experiment_panther:
    <<: *nav2-common
    container_name: experiment_panther
    volumes:
      - ../config:/config
      - ./config/cyclonedds-nav.xml:/config/cyclonedds-nav.xml
      - ../scripts:/experiment/scripts
    network_mode: "host"
    ipc: host
    depends_on:
      bt_orchestrator:
        condition: service_healthy
        restart: true
    command: >
      bash -c "source /ros_entrypoint.sh && python3 /experiment/scripts/single_robot_patrol.py panther 0 5"
