# =============================================================================
# HOST 3 (10.205.1.85) — Controller Only (Profiling Target)
# =============================================================================
# Runs ONLY the controller container for the single robot.
# All other Nav2 components and Gazebo run on HOST 1 and HOST 2.
#
# DDS cross-host communication is handled by CycloneDDS with explicit
# peer discovery configured in cyclonedds-edge.xml.
#
# No depends_on or healthcheck — the controller starts and waits for
# DDS topics from HOST 1 / HOST 2. It activates once the lifecycle manager
# on HOST 2's bt_orchestrator discovers it (or it self-activates
# via its own lifecycle manager).
#
# IMPORTANT:
#   - Same ROS_DOMAIN_ID as HOST 1 and HOST 2
#   - Same cyclonedds.xml with all three peer IPs
#   - Same nav2_params files
#   - use_sim_time:=True (clock comes from Gazebo on HOST 1 via DDS)
# =============================================================================

x-common-config:
  &common-config
  env_file: ../.env

x-nav2-common:
  &nav2-common
  <<: *common-config
  image: nav2-profiling:latest
  build:
    context: ../..
    dockerfile: docker/Dockerfile
  environment:
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
    - CYCLONEDDS_URI=file:///config/cyclonedds-edge.xml
  volumes:
    - ../config:/config
    - ./config/cyclonedds-edge.xml:/config/cyclonedds-edge.xml
    - ../../maps:/maps
    - ../../husarion_ugv_navigation:/ros2_ws/src/husarion_ugv_autonomy_ros/husarion_ugv_navigation
  network_mode: "host"
  ipc: host

services:
  # ===========================================================================
  # ROBOT 1 CONTROLLER (namespace = panther)
  # ===========================================================================
  controller:
    <<: *nav2-common
    container_name: panther_controller
    cpuset: "0-1"
    command: >
      ros2 launch husarion_ugv_navigation controller_launch.py
        namespace:=panther
        params_file:=/config/nav2_params_panther1.yaml
        use_sim_time:=True
        robot_model:=panther
        observation_topic:=/panther/velodyne_points
        observation_topic_type:=pointcloud
